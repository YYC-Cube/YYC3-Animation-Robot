name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel Deploy
    runs-on: ubuntu-latest
    # 可选：在 GitHub 仓库 Settings → Environments 创建 production 后加回
    # environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # 软门控：job 级 if 不支持 secrets 上下文，故在步骤内判定
      # 配置 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID 后自动生效
      - name: Gate (check secrets)
        id: gate
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::VERCEL_TOKEN 未配置，跳过部署（配置 secrets 后自动生效）"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm dlx vercel@latest deploy --prod --yes
